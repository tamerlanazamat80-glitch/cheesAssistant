name: Build Chess Assistant IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          mkdir project-src
          unzip -q "$ZIP_FILE" -d project-src
          cp project-src/project.yml .
          cp -R project-src/App .
          cp -R project-src/Extension .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild \
            -project ChessAssistant.xcodeproj \
            -scheme ChessAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ChessAssistant.app Payload/
          zip -qry ChessAssistant.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChessAssistant-IPA
          path: ChessAssistant.ipa
