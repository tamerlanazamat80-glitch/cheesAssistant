name: Build Chess Assistant IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p extracted
          ditto -x -k "$ZIP_FILE" extracted

          PROJECT_YML="$(find extracted -name project.yml -print -quit)"
          if [ -z "$PROJECT_YML" ]; then
            echo "project.yml was not found inside the ZIP."
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_YML")"
          cp "$PROJECT_DIR/project.yml" .
          cp -R "$PROJECT_DIR/App" .
          cp -R "$PROJECT_DIR/Extension" .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project ChessAssistant.xcodeproj \
            -scheme ChessAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ChessAssistant.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ChessAssistant-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessAssistant-unsigned-IPA
          path: ChessAssistant-unsigned.ipa
          if-no-files-found: error
